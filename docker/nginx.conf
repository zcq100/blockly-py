server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Pyodide 在独立 Web Worker 中运行，缺少这两个响应头时交互输入与运行线程不可用。
    # 这些头在 server 级统一设置，location 中不使用 add_header，以免覆盖继承。
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # 文件名带内容哈希，可以放心长期缓存。
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 部分 nginx 镜像的 mime.types 未登记 .wasm，显式兜底。
    # 正则 location 按书写顺序匹配，必须放在下面的 /python/ 之前。
    location ~ \.wasm$ {
        default_type application/wasm;
        expires 7d;
        try_files $uri =404;
    }

    # Pyodide 与 Blockly 资源文件名固定，升级镜像后需要在一周内生效。
    location ~ ^/(python|blockly-media)/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html 不缓存，保证发布新镜像后能拿到新的入口文件。
    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}

name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const {version}=JSON.parse(readFileSync('package.json','utf8'));
          const tag=process.env.GITHUB_REF_NAME;
          if(tag!==`v${version}`){
            console.error(`Tag ${tag} does not match package.json version v${version}`);
            process.exit(1);
          }
          JS

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          python3 <<'PYTHON'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          tag = os.environ['RELEASE_TAG']
          with ZipFile(f'release-artifacts/blockly-py-{tag}.zip', 'w', compression=ZIP_DEFLATED) as archive:
              for file in sorted(Path('dist').rglob('*')):
                  if file.is_file():
                      archive.write(file, file.relative_to('dist'))
          PYTHON
          (cd release-artifacts && sha256sum ./*.zip > SHA256SUMS)

      - name: Store release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
